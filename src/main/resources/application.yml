spring:
  application:
    name: ledgerflow
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

ledgerflow:
  idempotency:
    max-poll-attempts: 8
    min-poll-backoff: 50ms
    max-poll-backoff: 1s
  outbox:
    publisher:
      enabled: true
      poll-interval: PT1S
      batch-size: 50
      max-attempts: 5
