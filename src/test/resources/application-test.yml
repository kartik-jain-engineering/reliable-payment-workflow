# Profile used by the test suite. Connection settings are supplied at runtime
# by Testcontainers via @ServiceConnection, which contributes both the
# R2dbcConnectionDetails the app uses and the JdbcConnectionDetails Flyway
# needs — so no URL is set here for either.
spring:
  flyway:
    enabled: true
  # Tests authenticate via mockJwt(); this URI only lets Boot build a JwtDecoder and is never fetched.
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:1/unused-in-tests

ledgerflow:
  idempotency:
    max-poll-attempts: 15
  outbox:
    publisher:
      enabled: false

resilience4j:
  timelimiter:
    instances:
      paymentProvider:
        timeoutDuration: 1s
  retry:
    instances:
      paymentProvider:
        maxAttempts: 2
        waitDuration: 50ms
  circuitbreaker:
    instances:
      paymentProvider:
        waitDurationInOpenState: 100ms
        permittedNumberOfCallsInHalfOpenState: 2

logging:
  level:
    com.ledgerflow: DEBUG
    org.testcontainers: INFO
