# Profile used by the test suite. Connection settings are supplied at runtime
# by Testcontainers via @ServiceConnection, which contributes both the
# R2dbcConnectionDetails the app uses and the JdbcConnectionDetails Flyway
# needs — so no URL is set here for either.
spring:
  flyway:
    enabled: true

logging:
  level:
    com.ledgerflow: DEBUG
    org.testcontainers: INFO
